<rect x="36" y="580" width="2078" height="145" rx="14" fill="#fff1f2" stroke="#be123c" stroke-width="3"/>
<text class="head" x="58" y="614">Load-use repro from a separate real simulation: repeated stall, not a one-cycle bubble</text>
<text class="note" x="58" y="648">load_use_stall = 1 at 85, 95, 105 ns and continues beyond these samples.</text>
<text class="note" x="58" y="678">s1 and s2 stay on the same instructions; then retire_pc=3 repeats. This is a current RTL bug.</text>
<text class="note mono" x="58" y="708">Wave: doc/simple/load_use_repro.vcd   Slow I/O wave: doc/simple/slow_io_example.vcd, io_stall starts at 65 ns</text>
